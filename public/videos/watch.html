<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONE · Training video</title>
<style>
  body { margin: 0; background: #0f172a; color: #e2e8f0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 12px; color: #f8fafc; }
  .onems-video .ov-bar span { color: #94a3b8 !important; }
  .onems-video button { background: #1e293b !important; color: #e2e8f0 !important; border-color: #334155 !important; }
  .onems-video button[aria-pressed="true"] { background: #2563eb !important; border-color: #2563eb !important; color: #fff !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">ONE</h1>
  <div id="player"></div>
</main>
<script>
  // /videos/watch.html?v=<id>&lang=<es|fr|ar|pt|en>  (sin lang: idioma del navegador)
  (function () {
    var q = new URLSearchParams(location.search);
    var lang = (q.get('lang') || '').toLowerCase();
    if (lang) {
      document.documentElement.lang = lang;
      if (lang.indexOf('ar') === 0) document.documentElement.dir = 'rtl';
    }
    var el = document.getElementById('player');
    el.setAttribute('data-onems-video', q.get('v') || '');
    var titles = {
      'panelist-registration': 'ONE · Panelist registration',
      'roles-access': 'ONEMS · Roles and access',
      'panelist-guide': 'ONE · Panelist guide (Telegram)'
    };
    var t = titles[q.get('v')];
    if (t) { document.title = t; document.getElementById('title').textContent = t; }
  })();
</script>
<script src="player.js"></script>
</body>
</html>
