openapi: 3.1.0
info:
  title: ONEMS Carrier Link - API del conector (v4, entrega completa por periodo)
  version: "4.0.0"
  description: |
    API servidor a servidor entre el conector de un carrier y ONEMS. Especificación completa (normativa):
    docs/carrier-link/manual-conexion.es.md. Esquemas JSON (draft 2020-12): docs/carrier-link/schemas/.

    Flujo de cada entrega: GET /config -> POST /deliveries -> PUT del fichero a la URL firmada (sin clave) ->
    POST /deliveries/{id}/complete -> GET /deliveries/{id} hasta processed o rejected.

    Todos los errores tienen la forma {"success": false, "error": "<CL_CODIGO>", "message": "<texto fijo>",
    "detail"?: "<solo validación de la petición>"}. Límite: 30 peticiones por minuto y clave (429 + Retry-After: 60).
    El PUT del fichero no pasa por esta API: va directo al almacén con la URL firmada.
servers:
  - url: https://{proyecto}.supabase.co/functions/v1/carrier-link-ingest
    description: Dirección facilitada por el equipo de ONEMS.
    variables:
      proyecto:
        default: proyecto
        description: Identificador del proyecto (lo facilita ONEMS).
security:
  - apiKeyHeader: []
  - bearerAuth: []
paths:
  /config:
    get:
      operationId: getConnectorConfig
      summary: Configuración del conector de la clave y próximo periodo a entregar
      description: |
        Calendario, campos y equivalencias, productos, puntos de lectura con su papel, próximo periodo
        (next_period), última entrega, formatos y límites. El conector DEBE leerla antes de cada entrega.
      responses:
        "200":
          description: Configuración (schema_version 4.x). Las propiedades desconocidas se ignoran.
          content:
            application/json:
              schema: { $ref: "schemas/config-response.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Error" }
  /query:
    get:
      operationId: getExtractionQuery
      summary: Consulta SQL de extracción del próximo periodo, ya rellenada con la configuración del conector
      description: |
        Se construye en cada llamada a partir de lo mismo que devuelve GET /config: nombres de campo del carrier,
        campos extra, códigos de producto del plan, puntos acordados con su papel, zona horaria de las fechas,
        include_all_scans y el periodo de next_period (si no hay periodo pendiente, quedan los marcadores
        <PERIOD_START> y <PERIOD_END>). Dos sentencias: filas del fichero y totales de control. El carrier solo
        sustituye el nombre de su tabla de lecturas (table_placeholder). PostgreSQL está probado frente al
        simulador; Oracle y SQL Server se publican sin probar (tested = false).
      parameters:
        - name: db
          in: query
          required: false
          description: Tipo de base de datos del carrier.
          schema: { type: string, enum: [postgresql, oracle, sqlserver], default: postgresql }
      responses:
        "200":
          description: Consulta de extracción.
          content:
            application/json:
              schema: { $ref: "schemas/query-response.schema.json" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Error" }
  /deliveries:
    post:
      operationId: openDelivery
      summary: Abre la entrega de un periodo y devuelve la URL firmada de subida
      description: |
        Declara el periodo, el formato, el tamaño exacto, el sha256 del fichero y los totales de control.
        Idempotente: el mismo periodo con el mismo sha256 (y la misma clase, prueba o real) devuelve la entrega ya
        abierta (200, existing = true) y, si sigue esperando el fichero, una URL nueva. Con el conector en Pruebas
        la entrega es de prueba: no consume el periodo y se puede repetir. El PUT repetido de un fichero ya subido
        responde 409, o 400 con statusCode "409" en el cuerpo: ambos significan "ya subido". Lista cerrada de claves (otra clave -> 400).
        Sin compresión: `compression` solo puede faltar, ser null o "none"; una cabecera Content-Encoding distinta
        de identity -> 400 CL_COMPRESSION_UNSUPPORTED. Cuerpo de como mucho 5 MB.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "schemas/delivery-open-request.schema.json" }
            example:
              period_start: "2026-11-02"
              period_end: "2026-11-04"
              format: jsonl
              size_bytes: 52581
              sha256: a39b906da577380d0fd42864fd8d556022927f94db7ac6e00451931e33602095
              control_totals:
                - { place_ref: EMR-PO, mode_ref: DLV, product: STD, delivered: 54 }
                - { place_ref: NPT-PO, mode_ref: DLV, product: STD, delivered: 55 }
                - { place_ref: SVL-PO, mode_ref: DLV, product: STD, delivered: 54 }
      responses:
        "201":
          $ref: "#/components/responses/DeliveryOpened"
        "200":
          $ref: "#/components/responses/DeliveryOpened"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Error" }
  /deliveries/{id}/complete:
    post:
      operationId: completeDelivery
      summary: Avisa de que el fichero ya está subido
      description: |
        Sin cuerpo. received -> 202 (el proceso empieza en menos de un minuto; un complete repetido mientras sigue
        received también responde 202). Idempotente: si ya está en processing / processed / failed -> 200 con su
        estado. Conector pausado -> 403 CL_FEED_PAUSED. Si la entrega queda o está rejected, responde el
        código HTTP de su error (409, 410, 413, 422...) con la entrega en el cuerpo. Sin fichero -> 409
        CL_FILE_NOT_UPLOADED. Un id ajeno, inexistente o mal formado -> el mismo 404 CL_DELIVERY_NOT_FOUND.
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      responses:
        "202":
          description: Recibida (también al repetir complete mientras sigue received); se procesa en segundo plano.
          content:
            application/json:
              schema: { $ref: "schemas/delivery-response.schema.json" }
        "200":
          description: Ya estaba recibida, procesándose, procesada o fallida (se reintenta sola).
          content:
            application/json:
              schema: { $ref: "schemas/delivery-response.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Error" }
  /deliveries/{id}:
    get:
      operationId: getDelivery
      summary: Estado, fase, recuentos, motivos de rechazo y alertas de una entrega
      description: |
        Nunca dice qué envíos se sortearon. Una entrega rejected o failed también se consulta con 200 (el motivo
        está en delivery.error).
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      responses:
        "200":
          description: La entrega.
          content:
            application/json:
              schema: { $ref: "schemas/delivery-response.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Error" }
  /demands:
    get:
      operationId: v3Demands
      summary: Retirada (v3). Cualquier método y subruta de /demands responde 410.
      deprecated: true
      security: []
      responses:
        "410": { $ref: "#/components/responses/Gone" }
  /batches:
    post:
      operationId: v3Batches
      summary: Retirada (v3). Cualquier método y subruta de /batches responde 410.
      deprecated: true
      security: []
      responses:
        "410": { $ref: "#/components/responses/Gone" }
components:
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: Clave del conector (la entrega ONEMS una sola vez). Alternativa equivalente a bearerAuth.
    bearerAuth:
      type: http
      scheme: bearer
      description: "La misma clave en Authorization: Bearer <clave>."
  parameters:
    DeliveryId:
      name: id
      in: path
      required: true
      description: delivery_id devuelto por POST /deliveries.
      schema: { type: string, format: uuid }
  responses:
    DeliveryOpened:
      description: |
        201 = entrega nueva; 200 = el mismo periodo con el mismo sha256 ya estaba abierto (existing = true).
        upload = null si esa entrega ya no espera el fichero. Subir el fichero entero en UN PUT a upload.url con
        la cabecera Content-Type indicada (sin clave), antes de expires_in_seconds (2 h).
      content:
        application/json:
          schema: { $ref: "schemas/delivery-open-response.schema.json" }
          example:
            delivery:
              delivery_id: deb62bf0-e332-4e08-b8db-174359c0894a
              feed_id: c1517000-0000-4000-8000-0000000000f1
              status: pending_upload
              is_test: false
              source: api
              period_start: "2026-11-02"
              period_end: "2026-11-04"
              format: jsonl
              compression: none
              file_bytes: null
              sha256: a39b906da577380d0fd42864fd8d556022927f94db7ac6e00451931e33602095
              rows_total: null
              rows_rejected: null
              shipments_total: null
              shipments_valid: null
              shipments_drawn: null
              rejected_reasons: null
              error: null
              created_at: "2026-11-23T17:02:53.796305+00:00"
              received_at: null
              finished_at: null
              processing_started_at: null
              phase: null
              bytes_loaded: null
              rows_loaded: null
              attempts: 0
              existing: false
              max_file_bytes: 52428800
            upload:
              url: "https://proyecto.supabase.co/storage/v1/object/upload/sign/cl-deliveries/c1517000-0000-4000-8000-000000000001/c1517000-0000-4000-8000-0000000000f1/deb62bf0-e332-4e08-b8db-174359c0894a.jsonl?token=..."
              method: PUT
              headers: { Content-Type: application/x-ndjson }
              expires_in_seconds: 7200
    Unauthorized:
      description: Falta la clave, no existe, está inactiva o caducada, o no es una clave de conector.
      content:
        application/json:
          schema: { $ref: "schemas/error.schema.json" }
          example: { success: false, error: CL_UNAUTHORIZED, message: Invalid or inactive API key. }
    RateLimited:
      description: Más de 30 peticiones en el último minuto con esta clave. Esperar Retry-After segundos.
      headers:
        Retry-After:
          schema: { type: integer, const: 60 }
      content:
        application/json:
          schema: { $ref: "schemas/error.schema.json" }
          example:
            success: false
            error: CL_RATE_LIMITED
            message: "Rate limit exceeded: at most 30 requests per minute."
    Gone:
      description: Ruta de la versión 3 (demandas y lotes), retirada.
      content:
        application/json:
          schema: { $ref: "schemas/error.schema.json" }
          example:
            success: false
            error: CL_ENDPOINT_GONE
            message: "Carrier Link v4 removed the demand and batch endpoints. Deliver every complete shipment of the period as one file: GET /config, POST /deliveries, POST /deliveries/{id}/complete, GET /deliveries/{id}."
    Error:
      description: |
        Error con código CL_* (tabla completa en el manual, §11.2). En complete, si la entrega está rejected, el
        cuerpo incluye también `delivery`.
      content:
        application/json:
          schema: { $ref: "schemas/error.schema.json" }
          example:
            success: false
            error: CL_PERIOD_NOT_IN_CALENDAR
            message: The period does not match the delivery calendar. Use next_period from GET /config.
