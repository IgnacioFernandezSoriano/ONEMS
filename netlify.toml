[build]
  command = "pnpm install && pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--version"

[[redirects]]
  from = "/locales/*"
  to = "/locales/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Subtítulos de los vídeos de formación (Firefox exige este tipo).
[[headers]]
  for = "/videos/subs/*"
  [headers.values]
    Content-Type = "text/vtt; charset=utf-8"
